plugins {
    id 'com.android.application'
}

android {
    namespace 'com.exampro.student'
    compileSdk 34

    defaultConfig {
        applicationId 'com.exampro.student'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // توقيع تجريبي يكفي للتثبيت المباشر على الهواتف
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
